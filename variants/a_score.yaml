# Variant A (control): single 3-level complexity Score.
# Score probabilities come back keyed by level index ("0".."2"); tier_map maps
# each level to a tier. Router picks the cheapest tier with P(higher tier) <= epsilon.
name: a_score
question_id: complexity
question:
  type: score
  instructions: "How hard is this request for an AI model to answer well?"
  criteria:
    - "Simple: factual lookup, short rewrite, translation, or trivial code edit"
    - "Standard: multi-step reasoning, moderate code, debugging, or nuanced writing"
    - "Complex: deep or long reasoning, large code synthesis, proofs, or high-stakes decisions"
tier_map:
  "0": cheap
  "1": balanced
  "2": flagship
epsilon: 0.2
# Chosen on the v2 tune split for a 95% quality floor (per-prompt savings objective).
# Fine-tuned checkpoints are served under these names via LAYA_EXTRA_MODELS.
epsilon_by_model:
  typed-decisions: 0.2
  cheapshot-s0: 0.4
  cheapshot-v2: 0.37
  cheapshot-v3: 0.38
