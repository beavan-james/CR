[project]
name = "cheapshot"
version = "0.1.0"
description = "Cheapshot — classify initial prompt with Jev, route to cheapest suitable model (BYOK)"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.9",
  "rich>=13",
  "httpx>=0.27",
  "pyyaml>=6",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cheapshot = "cheapshot.cli:app"
jev = "cheapshot.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
