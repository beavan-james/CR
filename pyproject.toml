[project]
name = "cr"
version = "0.1.0"
description = "CR — cost-aware router for Claude Code: a Laya decision model routes each prompt or turn to the cheapest capable model"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.9",
  "rich>=13",
  "httpx>=0.27",
  "pyyaml>=6",
  "python-dotenv>=1",
  "anthropic>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cr = "cr.cli:app"
cheapshot = "cr.cli:app"  # pre-rename alias

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cr = ["curves/*.json"]
