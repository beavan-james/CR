[project]
name = "cheapshot"
version = "0.1.0"
description = "Cheapshot — cost-aware LLM router: a Laya decision model routes each prompt to the cheapest capable model (BYOK)"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.9",
  "rich>=13",
  "httpx>=0.27",
  "pyyaml>=6",
  "python-dotenv>=1",
  "anthropic>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cheapshot = "cheapshot.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cheapshot = ["curves/*.json"]
